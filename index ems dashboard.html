<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Energy monitoring: proposed dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f5f2; --card:#fff; --ink:#18241d; --muted:#5f6f66; --line:#dde6e0; --line2:#eef3ef;
  --green:#1f8a3f; --green-deep:#14532d; --green-soft:#e2f3e7;
  --amber:#b45f06; --amber-soft:#fdf0dc;
  --red:#c0392b; --red-soft:#fbe7e4;
  --grey:#8a9890; --grey-soft:#edf1ee;
  --blue:#2b6cb0;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7fc596;outline-offset:2px}
h1{font-size:1.65rem;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:600;margin:0}
.sub{color:var(--muted);margin:.15rem 0 0}
.num{font-variant-numeric:tabular-nums}

/* Layout */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:.7rem;align-items:center;padding:1.1rem 1.1rem 1rem;border-bottom:1px solid var(--line)}
.brand svg{flex:none}
.brand b{display:block;font-weight:600;line-height:1.2}
.brand span{font-size:.82rem;color:var(--muted)}
nav{padding:.8rem .7rem;display:flex;flex-direction:column;gap:.15rem}
nav button{display:flex;align-items:center;gap:.7rem;border:0;background:none;text-align:left;padding:.6rem .8rem;border-radius:8px;color:var(--muted)}
nav button:hover{background:var(--line2);color:var(--ink)}
nav button[aria-current="page"]{background:var(--green);color:#fff}
nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:.72rem;padding:0 .45rem;min-width:1.3rem;text-align:center}
nav button[aria-current="page"] .badge{background:#fff;color:var(--green-deep)}
.side-foot{margin-top:auto;padding:.8rem;display:flex;flex-direction:column;gap:.6rem}
.lastrep{background:var(--green-soft);border-radius:8px;padding:.6rem .75rem;font-size:.82rem;color:var(--green-deep)}
.lastrep b{display:block;font-weight:600}
.who{border:1px solid var(--line);border-radius:8px;padding:.55rem .75rem;font-size:.9rem}
.who small{display:block;color:var(--muted);font-size:.72rem}
.logout{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.5rem .75rem;text-align:left}

.main{min-width:0;display:flex;flex-direction:column}
.stickyhead{position:sticky;top:0;z-index:20}
.top{background:#fff;border-bottom:1px solid var(--line);padding:.7rem 1.6rem;display:flex;align-items:center;gap:1rem}
.top .title{font-weight:600;flex:1;text-align:center}
.top .tag{font-size:.78rem;background:var(--grey-soft);color:var(--muted);padding:.15rem .6rem;border-radius:999px}
.fresh{display:flex;align-items:center;gap:.7rem;padding:.55rem 1.6rem;font-size:.92rem;border-bottom:1px solid var(--line)}
.fresh .dot{width:10px;height:10px;border-radius:50%;flex:none}
.fresh.ok{background:var(--green-soft);color:var(--green-deep)} .fresh.ok .dot{background:var(--green)}
.fresh.warn{background:var(--amber-soft);color:#7a4204} .fresh.warn .dot{background:var(--amber)}
.fresh.bad{background:var(--red-soft);color:#7c2218;font-weight:500} .fresh.bad .dot{background:var(--red)}
.fresh .sp{margin-left:auto;font-size:.82rem;opacity:.85}
.content{padding:1.5rem 1.6rem 3rem;max-width:1280px;width:100%}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.card-h{display:flex;align-items:center;gap:.8rem;padding:.95rem 1.1rem;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card-h .grow{flex:1}
.card-b{padding:1.1rem}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin:1.2rem 0}
.kpi{padding:1rem 1.1rem}
.kpi .l{color:var(--muted);font-size:.85rem}
.kpi .v{font-size:1.75rem;font-weight:600;line-height:1.2;margin:.15rem 0}
.kpi .v small{font-size:.9rem;font-weight:500;color:var(--muted)}
.kpi .d{font-size:.84rem;color:var(--muted)}
.up{color:var(--red)} .down{color:var(--green)} .flat{color:var(--muted)}
.rate{display:inline-flex;align-items:center;gap:.35rem;margin-top:.2rem}
.rate input{width:4.2rem;padding:.15rem .4rem;border:1px solid var(--line);border-radius:6px}
.split{display:grid;grid-template-columns:1.15fr 1fr;gap:1rem;margin-bottom:1rem}

/* Attention list */
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;gap:.8rem;padding:.75rem 1.1rem;border-bottom:1px solid var(--line2);align-items:flex-start}
.att li:last-child{border-bottom:0}
.sev{flex:none;width:8px;align-self:stretch;border-radius:4px;background:var(--grey)}
.sev.critical{background:var(--red)} .sev.warning{background:var(--amber)} .sev.low{background:var(--grey)}
.att .t{font-weight:500}
.att .m{color:var(--muted);font-size:.86rem}
.att .r{margin-left:auto;text-align:right;white-space:nowrap;font-size:.86rem;color:var(--muted)}
.att .r b{display:block;color:var(--ink);font-weight:600}
.empty{padding:1.4rem 1.1rem;color:var(--muted)}

/* Top consumers */
.bars{padding:.4rem 1.1rem 1rem}
.brow{display:grid;grid-template-columns:minmax(120px,38%) 1fr 4.6rem;gap:.7rem;align-items:center;padding:.28rem 0;font-size:.9rem}
.brow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .tr{height:10px;background:var(--line2);border-radius:5px;overflow:hidden}
.brow .fl{height:100%;background:var(--green);border-radius:5px}
.brow .vl{text-align:right;font-weight:500}

/* Tables */
.tools{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:.4rem .85rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}
.search{border:1px solid var(--line);border-radius:8px;padding:.42rem .7rem;min-width:200px;background:#fff}
select.sel{border:1px solid var(--line);border-radius:8px;padding:.4rem .6rem;background:#fff}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:.62rem .9rem;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.84rem;background:#f8faf8;position:sticky;top:0}
th button{border:0;background:none;padding:0;color:inherit;font:inherit;display:inline-flex;gap:.3rem;align-items:center}
th button:hover{color:var(--ink)}
th.r,td.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover,tbody tr.click:hover .sticky1{background:#f6faf7}
td .mn{font-weight:500}
.pill{display:inline-flex;align-items:center;gap:.4rem;font-size:.84rem;padding:.12rem .6rem;border-radius:999px}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill.ok{background:var(--green-soft);color:var(--green-deep)} .pill.ok i{background:var(--green)}
.pill.high{background:var(--red-soft);color:#7c2218} .pill.high i{background:var(--red)}
.pill.idle{background:var(--amber-soft);color:#7a4204} .pill.idle i{background:var(--amber)}
.pill.nodata{background:var(--red-soft);color:#7c2218} .pill.nodata i{background:var(--red)}
.pill.unconf{background:var(--grey-soft);color:var(--muted)} .pill.unconf i{background:#fff;border:2px solid var(--grey)}
.chg{font-size:.88rem}
.sticky1{position:sticky;left:0;background:#fff}
thead .sticky1{background:#f8faf8;z-index:2}

details.nr summary{cursor:pointer;padding:.95rem 1.1rem;font-weight:600;list-style:none;display:flex;gap:.6rem;align-items:center}
details.nr summary::-webkit-details-marker{display:none}
details.nr summary:before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.nr[open] summary:before{transform:rotate(45deg)}
details.nr summary small{font-weight:400;color:var(--muted)}

/* Alerts */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin:1.2rem 0}
.chip{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.9rem 1.1rem;border-top-width:4px}
.chip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--green) inset}
.chip .l{color:var(--muted);font-size:.85rem}
.chip .v{font-size:1.7rem;font-weight:600;line-height:1.2}
.chip.c1{border-top-color:var(--red)} .chip.c2{border-top-color:var(--amber)} .chip.c3{border-top-color:var(--grey)} .chip.c4{border-top-color:var(--green)}
.alist{display:grid;gap:.8rem;margin-top:1rem}
.al{display:flex;gap:1rem;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.9rem 1.1rem;align-items:flex-start}
.al.dim{opacity:.6}
.al .body{flex:1;min-width:0}
.al .t{font-weight:600}
.al .m{color:var(--muted);font-size:.9rem;margin-top:.1rem}
.al .meta{font-size:.84rem;color:var(--muted);margin-top:.35rem}
.al .acts{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.4rem .8rem;font-size:.88rem}
.btn:hover{background:var(--line2)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#19733a}
.btn.danger{color:var(--red);border-color:#efc6c0}
.slider{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.slider input[type=range]{accent-color:var(--green);width:200px}
.note{background:var(--grey-soft);border-radius:8px;padding:.7rem .9rem;color:var(--muted);font-size:.88rem}

/* Reports */
.rep-ctl{display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end}
.rep-ctl label{display:flex;flex-direction:column;font-size:.82rem;color:var(--muted);gap:.2rem}
.rep-ctl input[type=date]{border:1px solid var(--line);border-radius:8px;padding:.38rem .6rem;background:#fff}
.chartwrap{display:grid;grid-template-columns:1fr 250px;gap:1rem}
.picker{border-left:1px solid var(--line2);padding-left:1rem;max-height:340px;overflow:auto;font-size:.9rem}
.picker label{display:flex;gap:.5rem;align-items:center;padding:.18rem 0}
.picker input{accent-color:var(--green)}
.picker .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1.1rem;font-size:.86rem;color:var(--muted);margin-top:.4rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:.4rem}
.totrow td{font-weight:600;background:#f6faf7}

/* Admin */
.form-row{display:grid;grid-template-columns:1fr 1fr 150px auto;gap:.8rem;align-items:end}
.form-row label{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--muted)}
.form-row input,.form-row select,.rs input{border:1px solid var(--line);border-radius:8px;padding:.45rem .7rem;background:#fff;width:100%}
.err{color:var(--red);font-size:.85rem;min-height:1.2em;margin-top:.4rem}
.role{font-size:.8rem;padding:.1rem .6rem;border-radius:999px;background:var(--grey-soft);color:var(--muted)}
.role.admin{background:var(--green);color:#fff}
.rs{display:flex;gap:.4rem}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;max-width:720px;width:calc(100% - 2rem);box-shadow:0 12px 40px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(20,40,28,.35)}
.dlg-h{display:flex;align-items:flex-start;gap:1rem;padding:1.1rem 1.3rem;border-bottom:1px solid var(--line2)}
.dlg-h .grow{flex:1}
.dlg-b{padding:1.1rem 1.3rem 1.3rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1rem}
.stats div{background:var(--bg);border-radius:8px;padding:.6rem .8rem}
.stats small{display:block;color:var(--muted);font-size:.8rem}
.stats b{font-size:1.1rem;font-weight:600}
.x{border:0;background:none;font-size:1.4rem;line-height:1;color:var(--muted)}

/* Toast, preview control */
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--green-deep);color:#fff;padding:.6rem 1.1rem;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
.preview{position:fixed;right:1rem;bottom:1rem;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;font-size:.82rem;box-shadow:0 4px 18px rgba(0,0,0,.12);z-index:40}
.preview b{display:block;font-weight:600;margin-bottom:.3rem}
.preview select{border:1px solid var(--line);border-radius:6px;padding:.25rem .4rem;background:#fff;width:100%}

@media (max-width:1000px){
  .grid4,.chips{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr}
  .chartwrap{grid-template-columns:1fr}
  .picker{border-left:0;padding-left:0;border-top:1px solid var(--line2);padding-top:.8rem}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side,.content,.card,.kpi{min-width:0}
  .att li{flex-wrap:wrap}
  .att .r{margin-left:1.1rem}
  .side{position:static;height:auto;flex-direction:column}
  .brand{padding:.7rem 1rem}
  nav{flex-direction:row;overflow-x:auto;padding:.4rem .6rem}
  nav button{white-space:nowrap;padding:.5rem .7rem}
  .side-foot{display:none}
  .top{padding:.6rem 1rem}
  .top .title{text-align:left}
  .fresh{padding:.55rem 1rem;flex-wrap:wrap}
  .fresh .sp{margin-left:0;width:100%}
  .content{padding:1.1rem 1rem 5rem}
  .grid4,.chips{grid-template-columns:1fr 1fr;gap:.7rem}
  .kpi .v{font-size:1.4rem}
  .form-row{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .preview{position:static;margin:1rem}
  .search{min-width:0;flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff}
  .stickyhead{position:static}
  .side,.top,.preview,.tools button,.no-print,#toast{display:none!important}
  .app{display:block}
  .content{padding:0;max-width:none}
  .card{break-inside:avoid}
  .fresh{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<dialog id="cdlg" aria-labelledby="cdlgTitle"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div class="preview no-print">
  <b>Preview control</b>
  <label for="age" style="display:block;margin-bottom:.2rem">Simulate data age</label>
  <select id="age">
    <option value="0">Fresh (12 min old)</option>
    <option value="2">2 days old</option>
    <option value="7">7 days old</option>
  </select>
</div>

<script>
/* ========== DATA (sample) ========== */
/*DATA*/
const N=30, D0=new Date(2026,7,25);
const dateOf=i=>new Date(D0.getFullYear(),D0.getMonth(),D0.getDate()+i);
const LAST=new Date(2026,8,24,9,0,6);
const F=[.7,.9,1,.05,1,.8,1,.4,.9,.6,.8,.3,.5,.9,.1,.02,.6,1.1,.9,.8,.05,.3,.8,1,.9,.7,1];
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const r2=x=>Math.round(x*100)/100;
const RAW=[
 ['New Paneling M/c Glue Unit','Main Plant',140490.86,[0.5,0,0],100,66.8],
 ['New Paneling M/c Cutter Unit','Main Plant',46408.23,[11.06,3.24,11.74],12],
 ['Old Paneling M/c Cutter Unit','Main Plant',36134.24,[234.71,94.17,165.80],230],
 ['Old Paneling M/c Heater Unit','Main Plant',55592.78,[174.76,63.14,156.94],170],
 ['Old Paneling M/c Glue Unit','Main Plant',13895.22,[43.03,16.77,43.74],45],
 ['Die Punching M/c 1 To 5','Main Plant',47956.02,[104.24,27.35,64.46],90],
 ['Slitting Machine M/c 1 To 5','Main Plant',50724.37,[68.71,21.92,60.48],65],
 ['Scarp & Office Unit','Main Plant',139005.09,[238.53,123.33,259.48],240],
 ['Security Cabin','Main Plant',10500.25,[69.88,25.73,52.65],60],
 ['Compressor, Holesaw & Cornor Cutting','Main Plant',87422.96,[230.62,81.69,192.06],200],
 ['Bandsaw M/c 1 To 6','Main Plant',28836.17,[63.05,27.04,65.49],62],
 ['Dock Leveler & Glue Mixer','Main Plant',6357.28,[2.46,0.83,5.03],2.6,2.2],
 ['Core M/c','Main Plant',277428.00,[262.82,0.84,256.50],150,143.0],
 ['Factory Lighting','Main Plant',72304.8,[103.52,46.51,104.00],95],
 ['Core Cutter Compressor','Main Plant',31388.9,[101.75,32.40,94.73],75,52.7],
 ['New Paneling Compressor','Main Plant',1047.5,'nodata'],
 ['Die punching compressor','Main Plant',1746.6,'nodata'],
 ['Box Assy Compressor','Main Plant',3348.1,'nodata'],
 ['Scrap Machine','Main Plant',2299.5,'nodata'],
 ['PDB-2 Main','Secondary Plant',0,'unconf'],
 ['New Core Machine','Secondary Plant',31655.4,[154.75,0.52,220.55],150],
 ['Meter-2','Secondary Plant',0,'unconf'],
 ['Meter-3','Secondary Plant',0,'unconf'],
 ['Meter-4','Secondary Plant',0,'unconf'],
 ['Meter-5','Secondary Plant',0,'unconf']
];
const PAL=['#14683a','#2b6cb0','#c9822b','#7a5ab8','#c1473a','#0f8f8f','#8a5a2b'];
const METERS=RAW.map((x,idx)=>{
  const [name,plant,rd,k,L,fit]=x;
  const m={id:'m'+idx,name,plant,reading:rd,t:'run',s:new Array(N).fill(0)};
  if(k==='nodata'){m.t='nodata';return m}
  if(k==='unconf'){m.t='unconf';return m}
  const R=rng(idx*977+13);
  for(let i=0;i<27;i++)m.s[i]=r2(L*F[i]*(0.8+0.4*R()));
  if(name==='New Core Machine')m.s[17]=551.8;
  m.s[27]=k[0];m.s[28]=k[1];m.s[29]=k[2];
  if(fit){
    const free=[];for(let i=16;i<=26;i++)free.push(i);
    const target=13*fit-(m.s[27]+m.s[28]);
    const cur=free.reduce((a,i)=>a+m.s[i],0)||1;
    const sc=target/cur;free.forEach(i=>m.s[i]=r2(m.s[i]*sc));
  }
  return m;
});
const sum=(a,i0,i1)=>{let t=0;for(let i=i0;i<=i1;i++)t+=a[i];return t};
const avg13=m=>sum(m.s,16,28)/13;
const dayTot=Array.from({length:N},(_,i)=>METERS.reduce((a,m)=>a+m.s[i],0));
function dstate(m,min){
  if(m.t==='nodata')return 'nodata';
  if(m.t==='unconf')return 'unconf';
  const y=m.s[29],a=avg13(m);
  if(y>1.5*a&&y-a>=min)return 'high';
  if(y<0.4*a&&a-y>=min)return 'idle';
  return 'ok';
}
function buildAlerts(min){
  const out=[];let suppressed=0;
  METERS.forEach(m=>{
    if(m.t==='nodata'){
      out.push({id:'off-'+m.id,type:'offline',sev:'warning',m,title:'No data since Sep 23',
        msg:'No readings received since Sep 23. Last known reading '+fmt(m.reading)+' kWh. Check the meter, wiring or gateway.',impact:0});
      return;
    }
    if(m.t!=='run')return;
    const y=m.s[29],a=avg13(m),d=y-a;
    if(y>1.5*a){
      if(d>=min)out.push({id:'sp-'+m.id,type:'spike',sev:sevOf(d),m,title:'Consumption spike (+'+Math.round(d/a*100)+'%)',
        msg:'Used '+fmt(y)+' kWh on Sep 23, '+fmt(d)+' kWh above its 13-day average of '+fmt(a)+' kWh.',impact:d});
      else suppressed++;
    }else if(y<0.4*a){
      if(-d>=min)out.push({id:'dr-'+m.id,type:'drop',sev:sevOf(-d),m,title:y===0?'No consumption recorded':'Unusual drop ('+Math.round(d/a*100)+'%)',
        msg:'Used '+fmt(y)+' kWh on Sep 23 against a 13-day average of '+fmt(a)+' kWh. The machine may have stopped.',impact:-d});
      else suppressed++;
    }
  });
  const rank={critical:0,warning:1,low:2};
  out.sort((p,q)=>rank[p.sev]-rank[q.sev]||q.impact-p.impact);
  return {list:out,suppressed};
}
const sevOf=d=>d>=100?'critical':d>=30?'warning':'low';
function buildInsights(){
  const out=[];
  const top=METERS.filter(m=>m.t==='run').sort((a,b)=>b.s[29]-a.s[29]).slice(0,3);
  top.forEach((m,i)=>out.push({id:'top-'+m.id,type:'top',m,title:(i?'#'+(i+1)+' ':'')+'Highest usage on Sep 23'.replace(/^Highest/,i?'highest':'Highest'),
    msg:m.name+' used '+fmt(m.s[29])+' kWh, among the top consumers.',impact:m.s[29]}));
  const tr=[];
  METERS.filter(m=>m.t==='run').forEach(m=>{
    const a=sum(m.s,23,29),b=sum(m.s,16,22);
    if(b>=50){const p=(a-b)/b;
      if(Math.abs(p)>=0.3)tr.push({id:'tr-'+m.id,type:'trend',m,title:'Trending '+(p>0?'up':'down')+' ('+(p>0?'+':'')+Math.round(p*100)+'%)',
        msg:'Last 7 days '+fmt(a)+' kWh against '+fmt(b)+' kWh in the 7 days before.',impact:Math.abs(a-b)})}
  });
  tr.sort((x,y)=>y.impact-x.impact);
  return out.concat(tr.slice(0,4));
}

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(Math.max(v,1))));const n=v/p;const st=[1,1.2,1.6,2,2.4,3,4,5,6,8,10].find(x=>n<=x+1e-9);return st*p}
function stackSVG(days,sel){
  const w=860,h=300,ml=48,mb=30,mt=10,mr=8;
  const series=sel.map(id=>METERS.find(m=>m.id===id));
  const data=days.map(i=>{const vals=series.map(m=>m.s[i]);const tot=dayTot[i];return {i,vals,oth:Math.max(0,tot-vals.reduce((a,b)=>a+b,0)),tot}});
  const mx=niceMax(Math.max(...data.map(d=>d.tot),1));
  const bw=(w-ml-mr)/data.length;
  let g='';
  for(let t=0;t<=4;t++){const v=mx*t/4,y=h-mb-(v/mx)*(h-mb-mt);g+='<line x1="'+ml+'" x2="'+(w-mr)+'" y1="'+y+'" y2="'+y+'" stroke="#e4ebe6"/><text x="'+(ml-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#5f6f66">'+fmt(v,0)+'</text>'}
  const step=Math.ceil(data.length/10);
  data.forEach((d,k)=>{
    let y=h-mb;const x=ml+k*bw+bw*0.14,ww=bw*0.72;
    const parts=d.vals.map((v,j)=>[v,PAL[j]]).concat([[d.oth,'#c3cdc7']]);
    parts.forEach(([v,c],j)=>{if(v<=0)return;const hh=v/mx*(h-mb-mt);y-=hh;
      const nm=j<series.length?series[j].name:'Others';
      g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+ww.toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+c+'"><title>'+dshort(dateOf(d.i))+', '+esc(nm)+': '+fmt(v)+' kWh</title></rect>'});
    if(k%step===0)g+='<text x="'+(x+ww/2).toFixed(1)+'" y="'+(h-10)+'" text-anchor="middle" font-size="11" fill="#5f6f66">'+dshort(dateOf(d.i))+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="Daily consumption stacked by meter, in kWh">'+g+'</svg>';
}
function rangeDays(){const a=[];for(let i=S.rFrom;i<=S.rTo;i++)a.push(i);return a}
function pageReports(){
  const days=rangeDays(),sel=S.rSel;
  const run=METERS.filter(m=>m.t==='run');
  const full=sel.length>=6;
  const legend=sel.map((id,j)=>'<span><i style="background:'+PAL[j]+'"></i>'+esc(METERS.find(m=>m.id===id).name)+'</span>').join('')+'<span><i style="background:#c3cdc7"></i>Others</span>';
  const totals=sel.map(id=>sum(METERS.find(m=>m.id===id).s,S.rFrom,S.rTo));
  const grand=sum(dayTot,S.rFrom,S.rTo);
  const preset=(k,l,f,t)=>'<button data-act="preset" data-f="'+f+'" data-t="'+t+'" aria-pressed="'+(S.rFrom===f&&S.rTo===t)+'">'+l+'</button>';
  return '<h1>Reports</h1><p class="sub">Daily consumption for any period, with CSV and PDF export.</p>'
  +'<section class="card" style="margin:1.2rem 0 1rem"><div class="card-b rep-ctl">'
   +'<div class="seg" role="group" aria-label="Period presets">'+preset('7','Last 7 days',23,29)+preset('14','Last 14 days',16,29)+preset('mtd','This month',7,29)+preset('30','Last 30 days',0,29)+'</div>'
   +'<label>From<input type="date" id="rf" min="'+iso(dateOf(0))+'" max="'+iso(dateOf(29))+'" value="'+iso(dateOf(S.rFrom))+'" data-bind="rFrom"></label>'
   +'<label>To<input type="date" id="rt" min="'+iso(dateOf(0))+'" max="'+iso(dateOf(29))+'" value="'+iso(dateOf(S.rTo))+'" data-bind="rTo"></label>'
   +'<span style="flex:1"></span><button class="btn primary" data-act="csv">Download CSV</button><button class="btn" data-act="print">Save as PDF</button></div></section>'
  +'<section class="card"><div class="card-h"><h2 class="grow">Daily consumption (kWh)</h2><span class="sub">Total for period: <b style="color:var(--ink)">'+fmt(grand,0)+' kWh</b> · est. '+inr(grand*S.rate)+'</span></div><div class="card-b chartwrap"><div>'+stackSVG(days,sel)+'<div class="legend">'+legend+'</div></div>'
   +'<div class="picker no-print"><div class="ph"><span>Meters shown</span><span><button class="btn" data-act="top5" style="padding:.15rem .5rem">Top 5</button></span></div><div class="sub" style="font-size:.82rem;margin-bottom:.4rem">Pick up to 6. The rest are grouped as Others.</div>'
   +run.map(m=>{const on=sel.includes(m.id);return '<label><input type="checkbox" data-act="pick" data-id="'+m.id+'"'+(on?' checked':'')+((!on&&full)?' disabled':'')+'>'+esc(m.name)+'</label>'}).join('')+'</div></div></section>'
  +'<section class="card" style="margin-top:1rem"><div class="card-h"><h2 class="grow">Daily data</h2><span class="sub">Selected meters, others grouped</span></div><div class="tw" style="max-height:440px;overflow:auto"><table><thead><tr><th class="sticky1">Date</th>'
   +sel.map(id=>'<th class="r">'+esc(METERS.find(m=>m.id===id).name)+'</th>').join('')+'<th class="r">Others</th><th class="r">Total (kWh)</th></tr></thead><tbody>'
   +'<tr class="totrow"><td class="sticky1" style="background:#f6faf7">Period total</td>'+totals.map(t=>'<td class="r">'+fmt(t)+'</td>').join('')+'<td class="r">'+fmt(grand-totals.reduce((a,b)=>a+b,0))+'</td><td class="r">'+fmt(grand)+'</td></tr>'
   +days.slice().reverse().map(i=>{const v=sel.map(id=>METERS.find(m=>m.id===id).s[i]);const o=Math.max(0,dayTot[i]-v.reduce((a,b)=>a+b,0));
     return '<tr><td class="sticky1">'+dlong(dateOf(i))+'</td>'+v.map(x=>'<td class="r">'+fmt(x)+'</td>').join('')+'<td class="r">'+fmt(o)+'</td><td class="r"><b>'+fmt(dayTot[i])+'</b></td></tr>'}).join('')
   +'</tbody></table></div></section>';
}

/* ========== ADMIN ========== */
function pageAdmin(){
  return '<div style="display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap"><div style="flex:1"><h1>Admin</h1><p class="sub">Manage who can sign in. Passwords are stored hashed and can never be viewed.</p></div></div>'
  +'<section class="card" style="margin:1.2rem 0 1rem"><div class="card-h"><h2>Add a new user</h2></div><div class="card-b"><div class="form-row">'
   +'<label>Username<input id="nu" autocomplete="off" placeholder="e.g. operator1"></label>'
   +'<label>Password<input id="np" type="password" autocomplete="new-password" placeholder="At least 8 characters"></label>'
   +'<label>Role<select id="nr"><option value="viewer">Viewer</option><option value="admin">Admin</option></select></label>'
   +'<button class="btn primary" data-act="adduser">Add user</button></div><div class="err" id="aerr" role="alert">'+esc(S.err)+'</div></div></section>'
  +'<section class="card"><div class="card-h"><h2>Users</h2></div><div class="tw"><table><thead><tr><th>Username</th><th>Role</th><th>Password</th><th>Reset password</th><th class="r">Actions</th></tr></thead><tbody>'
   +S.users.map((u,i)=>'<tr><td><span class="mn">'+esc(u.u)+'</span></td><td><span class="role '+u.role+'">'+u.role+'</span></td><td><span style="color:var(--muted)">Hidden (hashed)</span></td>'
     +'<td><div class="rs"><input type="password" id="rp'+i+'" placeholder="New password, 8+ characters" aria-label="New password for '+esc(u.u)+'" style="min-width:220px"><button class="btn" data-act="setpw" data-i="'+i+'">Set</button></div></td>'
     +'<td class="r"><button class="btn danger" data-act="rmuser" data-i="'+i+'">Remove</button></td></tr>').join('')
   +'</tbody></table></div></section>';
}

/* ========== DETAIL DIALOG ========== */
function showDetail(id){
  const m=METERS.find(x=>x.id===id),st=dstate(m,S.min),dlg=$('#dlg');
  let body;
  if(m.t!=='run'){
    body='<p>'+(m.t==='nodata'?'This meter has sent no data since 23 Sep. Last known reading: <b>'+fmt(m.reading)+' kWh</b>. Check the meter supply, the RS-485 wiring and the gateway.':'No readings are configured for this meter yet.')+'</p>';
  }else{
    const a=avg13(m),y=m.s[29];
    const w=640,h=170,ml=36,mb=24,mt=8,mx=niceMax(Math.max(...m.s,1)),bw=(w-ml)/N;
    let g='';
    for(let t=0;t<=3;t++){const v=mx*t/3,yy=h-mb-(v/mx)*(h-mb-mt);g+='<line x1="'+ml+'" x2="'+w+'" y1="'+yy+'" y2="'+yy+'" stroke="#e4ebe6"/><text x="'+(ml-5)+'" y="'+(yy+4)+'" text-anchor="end" font-size="10" fill="#5f6f66">'+fmt(v,0)+'</text>'}
    m.s.forEach((v,i)=>{const hh=v/mx*(h-mb-mt);g+='<rect x="'+(ml+i*bw+1.5).toFixed(1)+'" y="'+(h-mb-hh).toFixed(1)+'" width="'+(bw-3).toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+(i===29?STC[st]:'#9cc8ae')+'"><title>'+dshort(dateOf(i))+': '+fmt(v)+' kWh</title></rect>';if(i%6===0)g+='<text x="'+(ml+i*bw+bw/2).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="10" fill="#5f6f66">'+dshort(dateOf(i))+'</text>'});
    body='<div class="stats"><div><small>23 Sep</small><b>'+fmt(y)+' kWh</b></div><div><small>13-day average</small><b>'+fmt(a)+' kWh</b></div><div><small>14-day total</small><b>'+fmt(sum(m.s,16,29),0)+' kWh</b></div><div><small>Est. cost, 23 Sep</small><b>'+inr(y*S.rate)+'</b></div></div>'
      +'<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="Daily kWh for the last 30 days">'+g+'</svg>'
      +'<p class="sub" style="margin-top:.6rem">Current reading '+fmt(m.reading,2)+' kWh. Last 30 days shown; the latest day is highlighted.</p>';
  }
  dlg.innerHTML='<div class="dlg-h"><div class="grow"><h2 id="dlgTitle" style="font-size:1.25rem">'+esc(m.name)+'</h2><div class="sub">'+esc(m.plant)+' · '+pill(st)+'</div></div><button class="x" data-act="closedlg" aria-label="Close">×</button></div><div class="dlg-b">'+body+'</div>';
  if(!dlg.open)dlg.showModal();
}
function confirmDlg(title,msg,onYes){
  const d=$('#cdlg');
  d.innerHTML='<div class="dlg-h"><div class="grow"><h2 id="cdlgTitle" style="font-size:1.15rem">'+esc(title)+'</h2></div></div><div class="dlg-b"><p>'+esc(msg)+'</p><div style="display:flex;gap:.6rem;justify-content:flex-end"><button class="btn" id="cno">Cancel</button><button class="btn danger" id="cyes">Remove user</button></div></div>';
  d.showModal();
  $('#cno').onclick=()=>d.close();
  $('#cyes').onclick=()=>{d.close();onYes()};
}

/* ========== CSV ========== */
function exportCSV(){
  const sel=S.rSel.map(id=>METERS.find(m=>m.id===id));
  const days=rangeDays();
  const head=['Date'].concat(sel.map(m=>m.name),['Others','Total kWh','Est. cost INR']);
  const rows=days.map(i=>{const v=sel.map(m=>m.s[i]);const o=Math.max(0,dayTot[i]-v.reduce((a,b)=>a+b,0));
    return [iso(dateOf(i))].concat(v.map(x=>x.toFixed(2)),[o.toFixed(2),dayTot[i].toFixed(2),(dayTot[i]*S.rate).toFixed(0)])});
  const csv=[head].concat(rows).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='energy-report-'+iso(dateOf(S.rFrom))+'-to-'+iso(dateOf(S.rTo))+'.csv';a.click();
  toast('CSV downloaded');
}

/* ========== RENDER / EVENTS ========== */
function render(){
  const pages={dashboard:pageDashboard,live:pageLive,alerts:pageAlerts,reports:pageReports,admin:pageAdmin};
  $('#app').innerHTML=chrome(pages[S.page]());
  document.title='Energy monitoring: '+({dashboard:'Dashboard',live:'Live Data',alerts:'Alerts',reports:'Reports',admin:'Admin'})[S.page];
  if(S.focus){const e=document.getElementById(S.focus.id);if(e){e.focus();try{e.setSelectionRange(S.focus.c,S.focus.c)}catch(_){}}S.focus=null}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,d=t.dataset;
  if(a==='pick')return;
  switch(a){
    case 'nav':S.page=d.p;history.replaceState(null,'','#'+d.p);window.scrollTo(0,0);break;
    case 'plant':S.plant=d.p;break;
    case 'sort':S.sort=S.sort.key===d.k?{key:d.k,dir:-S.sort.dir}:{key:d.k,dir:d.k==='name'||d.k==='plant'?1:-1};break;
    case 'lsort':S.lsort=S.lsort.key===d.k?{key:d.k,dir:-S.lsort.dir}:{key:d.k,dir:d.k==='name'||d.k==='plant'||d.k==='st'?1:-1};break;
    case 'lplant':S.lplant=d.p;break;
    case 'detail':showDetail(d.id);return;
    case 'closedlg':$('#dlg').close();return;
    case 'refresh':toast('Updated just now');break;
    case 'atab':S.atab=d.k;S.atype='all';break;
    case 'atype':S.atype=S.atype===d.k?'all':d.k;S.atab='active';break;
    case 'ack':S.ack.add(d.id);toast('Alert acknowledged');break;
    case 'unack':S.ack.delete(d.id);toast('Alert reopened');break;
    case 'snz':S.snooze.add(d.id);toast('Snoozed for 24 hours');break;
    case 'preset':S.rFrom=+d.f;S.rTo=+d.t;S.rSel=topFive();break;
    case 'top5':S.rSel=topFive();break;
    case 'csv':exportCSV();return;
    case 'print':window.print();return;
    case 'logout':toast('Log out is disabled in this preview');return;
    case 'adduser':{
      const u=$('#nu').value.trim(),p=$('#np').value,r=$('#nr').value;
      if(!u){S.err='Enter a username.';break}
      if(S.users.some(x=>x.u.toLowerCase()===u.toLowerCase())){S.err='That username already exists.';break}
      if(p.length<8){S.err='Use a password of at least 8 characters.';break}
      S.users.push({u,len:p.length,role:r});S.err='';toast('User '+u+' added');break}
    case 'setpw':{
      const p=$('#rp'+d.i).value;
      if(p.length<8){toast('Use a password of at least 8 characters');return}
      toast('Password updated for '+S.users[d.i].u);$('#rp'+d.i).value='';return}
    case 'rmuser':{
      const u=S.users[d.i];
      confirmDlg('Remove '+u.u+'?','They will no longer be able to sign in. This cannot be undone.',()=>{S.users.splice(d.i,1);toast(u.u+' removed');render()});return}
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='pick'){
    const id=t.dataset.id;
    if(t.checked){if(S.rSel.length<6)S.rSel.push(id)}else S.rSel=S.rSel.filter(x=>x!==id);
    render();return;
  }
  if(t.id==='age'){S.age=+t.value;render();return}
  if(t.dataset.bind==='lstat'){S.lstat=t.value;render();return}
  if(t.dataset.bind==='rFrom'||t.dataset.bind==='rTo'){
    const idx=Math.round((new Date(t.value+'T00:00:00')-D0)/864e5);
    if(isNaN(idx))return;
    const v=Math.max(0,Math.min(29,idx));
    if(t.dataset.bind==='rFrom')S.rFrom=Math.min(v,S.rTo);else S.rTo=Math.max(v,S.rFrom);
    render();
  }
});
document.addEventListener('input',e=>{
  const t=e.target,b=t.dataset.bind;if(!b)return;
  if(b==='q'||b==='lq'){S[b]=t.value;S.focus={id:t.id,c:t.selectionStart};render()}
  else if(b==='min'){S.min=+t.value;S.focus={id:'min',c:0};render()}
  else if(b==='rate'){const v=parseFloat(t.value);if(!isNaN(v)&&v>=0){S.rate=v;S.focus=null;
      const s=t.selectionStart;S.focus={id:null,c:s};render();
      const n=document.querySelector('[data-bind="rate"]');if(n){n.focus();try{n.setSelectionRange(s,s)}catch(_){}} S.focus=null}}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act="detail"]')){e.preventDefault();showDetail(e.target.dataset.id)}
});
['dlg','cdlg'].forEach(i=>$('#'+i).addEventListener('click',e=>{if(e.target.id===i)e.target.close()}));
const h=location.hash.replace('#','');if(['dashboard','live','alerts','reports','admin'].includes(h))S.page=h;
render();
</script>
</body>
